name: deploy

# Todo commit em main: testes -> migrations no Supabase.
# A Vercel publica o front sozinha pela integração Git (main = produção).
# O seed NUNCA roda aqui (rules/restrictions.md): dado de produção é executado por uma pessoa.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      DIRECT_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Os testes sobem o próprio Postgres (Testcontainers); nunca usam o banco de produção.
      - run: npm test
      - run: npm run build

  migrate:
    needs: verify
    runs-on: ubuntu-latest
    # Os secrets estão em Environments > production.
    environment: production
    steps:
      - name: Segredos presentes?
        env:
          HAS_DIRECT_URL: ${{ secrets.DIRECT_URL != '' }}
          HAS_DATABASE_URL: ${{ secrets.DATABASE_URL != '' }}
        run: |
          missing=0
          for v in DIRECT_URL DATABASE_URL; do
            var="HAS_$v"
            if [ "${!var}" != "true" ]; then echo "::error::secret ausente: $v"; missing=1; fi
          done
          exit $missing
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Só migrations já commitadas. Mudança de schema segue rules/migration.md antes de chegar aqui.
      - name: Migrations no Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma migrate deploy
